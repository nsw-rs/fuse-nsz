[package]
name = "fuse-nsz"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "FUSE filesystem that shows NSZ/XCZ files as plain NSP/XCI"
license = "MIT OR Apache-2.0"
authors = ["Timothy Redaelli <timothy.redaelli@gmail.com>"]
repository = "https://github.com/nsw-rs/fuse-nsz"
readme = "README.md"
keywords = ["nintendo-switch", "fuse", "nsz", "xcz", "winfsp"]
categories = ["filesystem", "command-line-utilities"]
exclude = ["/.github", "/.gitignore", "/deny.toml"]

# Matches the asset names and layout made by .github/workflows/release.yml.
# pkg-fmt is left unset so binstall tries both the .tar.gz and .zip archives.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[dependencies]
libhac = { version = "0.1.2", features = ["ncz"] }

[target.'cfg(unix)'.dependencies]
fuser = "0.18.0"
libc = "0.2"
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
winfsp_wrs = "0.4.1"
# Only for the error table of WinFsp, which winfsp_wrs does not hand on.
winfsp_wrs_sys = "0.4.1"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
