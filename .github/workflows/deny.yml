name: Cargo Deny

on:
  push:
    branches: [ master ]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'deny.toml'
  pull_request:
    branches: [ master ]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'deny.toml'
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC (advisories DB refresh)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check licenses, bans, advisories and sources
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features
          manifest-path: Cargo.toml
